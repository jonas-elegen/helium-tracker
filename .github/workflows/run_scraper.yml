name: Run Helium Tank Tracker

on:
  workflow_dispatch:

jobs:
  scrape-and-log:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
    
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Libraries & Browser Engine
      run: |
        pip install playwright gspread oauth2client
        playwright install chromium
        
    - name: Execute Tank Automation Script
      env:
        AIRGAS_USER: ${{ secrets.AIRGAS_USER }}
        AIRGAS_PASS: ${{ secrets.AIRGAS_PASS }}
        GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
      run: |
        for i in {1..3}; do
          echo "Attempt $i of 3..."
          python main.py && break || {
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed due to a temporary glitch. Retrying in 30 seconds..."
              sleep 30
            else
              echo "All 3 attempts failed. Script is exiting."
              exit 0
            fi
          }
        done
